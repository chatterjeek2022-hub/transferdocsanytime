<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TransferDocs Turbo Complete</title>

<link rel="icon" href="transferdocs.png">
<link rel="apple-touch-icon" href="transferdocs.png">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f5f3ff,#fdf2f8);
}

.card{
background:white;
padding:25px;
border-radius:28px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

</style>

</head>

<body class="p-5">

<div class="max-w-6xl mx-auto">

<div class="card mb-6 flex items-center gap-5">

<img src="transferdocs.png"
class="w-24 h-24 rounded-3xl">

<div>
<h1 class="text-4xl font-bold text-indigo-900">
⚡ TransferDocs Turbo
</h1>

<p class="text-gray-600 mt-2">
Fast personal file transfer ecosystem
</p>
</div>

</div>

<div class="grid md:grid-cols-2 gap-6">

<!-- SEND -->

<div class="card">

<h2 class="text-3xl font-bold text-indigo-900 mb-5">
📤 Send Files
</h2>

<input type="file"
id="fileInput"
multiple
class="mb-5 block w-full">

<div id="selectedFiles"
class="space-y-2 mb-5"></div>

<button onclick="uploadFiles()"
class="bg-indigo-700 text-white px-6 py-4 rounded-2xl font-bold">
⚡ Upload Files
</button>

<div class="w-full bg-gray-200 rounded-full h-6 mt-5 overflow-hidden">

<div id="progressBar"
class="bg-indigo-700 h-6 w-0 text-white text-sm text-center">
</div>

</div>

<div id="uploadStatus"
class="mt-5 font-bold text-indigo-900"></div>

</div>

<!-- RECEIVE -->

<div class="card">

<h2 class="text-3xl font-bold text-green-900 mb-5">
📥 Receive Files
</h2>

<input type="text"
id="receiveCode"
placeholder="Enter Transfer Code"
class="border rounded-2xl p-4 w-full mb-5">

<button onclick="receiveFiles()"
class="bg-green-700 text-white px-6 py-4 rounded-2xl font-bold">
Download Files
</button>

<div id="receiveStatus"
class="mt-5 font-bold text-green-900"></div>

</div>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDjDw5V-itufoJCpyB-QLPPU9-h56VMqaE",
  authDomain: "transfer-docs-anytime.firebaseapp.com",
  projectId: "transfer-docs-anytime",
  storageBucket: "transfer-docs-anytime.firebasestorage.app",
  messagingSenderId: "52858508917",
  appId: "1:52858508917:web:b3daf8f76aff16c5a04a3c"
};

firebase.initializeApp(firebaseConfig);

const storage = firebase.storage();
const db = firebase.firestore();

firebase.auth().signInAnonymously()
.then(()=>{
console.log("Auth success");
})
.catch(err=>{
console.error(err);
});

/* FILE PREVIEW */

document.getElementById("fileInput")
.addEventListener("change",e=>{

const files = e.target.files;

const area =
document.getElementById("selectedFiles");

area.innerHTML = "";

Array.from(files).forEach(file=>{

const size =
(file.size/(1024*1024)).toFixed(2);

area.innerHTML += `
<div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3">
${file.name} (${size} MB)
</div>
`;

});

});

/* UPLOAD */

async function uploadFiles(){

const files =
document.getElementById("fileInput").files;

if(!files.length){

alert("Select files");

return;

}

const progressBar =
document.getElementById("progressBar");

const status =
document.getElementById("uploadStatus");

try{

let uploadBlob;
let uploadName;

if(files.length > 1){

status.innerText =
"Compressing multiple files...";

const zip = new JSZip();

Array.from(files).forEach(file=>{

zip.file(file.name,file);

});

uploadBlob =
await zip.generateAsync({
type:"blob",
compression:"DEFLATE"
});

uploadName =
"transferdocs_bundle.zip";

}else{

uploadBlob = files[0];
uploadName = files[0].name;

}

const code =
Math.floor(
100000 + Math.random()*900000
).toString();

const ref =
storage.ref(
`transfers/${code}/${uploadName}`
);

const uploadTask =
ref.put(uploadBlob);

uploadTask.on(

"state_changed",

(snapshot)=>{

const progress =
(snapshot.bytesTransferred /
snapshot.totalBytes) * 100;

progressBar.style.width =
progress + "%";

progressBar.innerText =
Math.floor(progress) + "%";

},

(error)=>{

status.innerText =
"Upload failed: " + error.message;

},

async()=>{

const url =
await uploadTask.snapshot.ref.getDownloadURL();

await db.collection("transfers")
.doc(code)
.set({

downloadURL:url,
filename:uploadName,
createdAt:Date.now(),
expiry:Date.now()+(24*60*60*1000)

});

status.innerHTML = `
<div class="bg-green-100 border border-green-300 rounded-2xl p-5">
✅ Upload Successful<br><br>
Transfer Code:
<div class="text-5xl font-bold text-green-800 mt-3">
${code}
</div>
</div>
`;

}

);

}catch(err){

status.innerText =
"Upload failed: " + err.message;

}

}

/* RECEIVE */

async function receiveFiles(){

const code =
document.getElementById("receiveCode").value;

const status =
document.getElementById("receiveStatus");

if(!code){

alert("Enter transfer code");

return;

}

status.innerText =
"Searching transfer...";

try{

const doc =
await db.collection("transfers")
.doc(code)
.get();

if(!doc.exists){

status.innerText =
"Transfer not found";

return;

}

const data = doc.data();

status.innerHTML = `
<div class="bg-green-100 border border-green-300 rounded-2xl p-5">
✅ File Found<br><br>

<b>Filename:</b>
${data.filename}

<br><br>

<a href="${data.downloadURL}"
download
target="_blank"
class="bg-green-700 text-white px-5 py-3 rounded-2xl inline-block mt-3 font-bold">
⬇ Download File
</a>

</div>
`;

}catch(err){

status.innerText =
"Receive failed: " + err.message;

}

}

</script>

</body>
</html>
