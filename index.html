<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransferDocs</title>

<link rel="apple-touch-icon" href="transferdocs.png">
<link rel="icon" type="image/png" href="transferdocs.png">
<link rel="shortcut icon" href="transferdocs.png">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
body{
background:linear-gradient(to bottom right,#eff6ff,#dbeafe);
font-family:Arial,sans-serif;
}

.card{
background:white;
border-radius:24px;
padding:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.input{
width:100%;
padding:14px;
border-radius:16px;
border:1px solid #bfdbfe;
}
</style>
</head>

<body class="min-h-screen p-5">

<div class="max-w-5xl mx-auto">

<div class="card mb-6">

<div class="flex items-center gap-4">

<img
src="transferdocs.png"
class="w-20 h-20 rounded-2xl object-cover"
>

<div>
<h1 class="text-4xl font-bold text-blue-900">
📁 TransferDocs
</h1>

<p class="text-gray-600 mt-2">
Personal Secure Document Transfer System
</p>
</div>

</div>

</div>

<div class="grid lg:grid-cols-2 gap-6">

<div class="card">

<h2 class="text-2xl font-bold text-blue-900 mb-5">
Send Documents
</h2>

<div class="space-y-4">

<input
id="fileInput"
type="file"
multiple
class="input"
>

<button
onclick="uploadFiles()"
class="bg-blue-700 hover:bg-blue-800 text-white rounded-2xl p-4 w-full font-bold text-lg"
>
Upload & Generate Transfer Code
</button>

<div id="uploadStatus" class="text-sm text-gray-700"></div>

<div id="generatedCode"
class="hidden bg-blue-50 border border-blue-200 rounded-2xl p-5 mt-4">

<div class="text-blue-900 font-bold text-lg mb-3">
Transfer Code
</div>

<div id="transferCodeDisplay"
class="text-5xl font-bold text-center tracking-widest text-blue-900">
</div>

</div>

</div>

</div>

<div class="card">

<h2 class="text-2xl font-bold text-green-900 mb-5">
Receive Documents
</h2>

<div class="space-y-4">

<input
id="receiveCode"
class="input text-center text-3xl tracking-widest"
placeholder="123456"
maxlength="6"
>

<button
onclick="fetchFiles()"
class="bg-green-700 hover:bg-green-800 text-white rounded-2xl p-4 w-full font-bold text-lg"
>
Fetch Files
</button>

<div id="receiveStatus" class="text-sm text-gray-700"></div>

<div id="downloadArea" class="space-y-3"></div>

</div>

</div>

</div>

</div>

<script>


const firebaseConfig = {
  apiKey: "AIzaSyDjDw5V-itufoJCpyB-QLPPU9-h56VMqaE",
  authDomain: "transfer-docs-anytime.firebaseapp.com",
  projectId: "transfer-docs-anytime",
  storageBucket: "transfer-docs-anytime.firebasestorage.app",
  messagingSenderId: "52858508917",
  appId: "1:52858508917:web:b3daf8f76aff16c5a04a3c"
};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const storage = firebase.storage();

function generateCode(){
return Math.floor(100000 + Math.random() * 900000).toString();
}

async function uploadFiles(){

const files = document.getElementById('fileInput').files;

if(files.length === 0){
alert('Please select files');
return;
}

const code = generateCode();

const status = document.getElementById('uploadStatus');
status.innerText = 'Uploading files...';

const uploadedFiles = [];

try{

for(const file of files){

const ref = storage.ref(`transfers/${code}/${file.name}`);

await ref.put(file);

const url = await ref.getDownloadURL();

uploadedFiles.push({
name:file.name,
url:url,
size:file.size
});

}

await db.collection('transfers').doc(code).set({
createdAt: Date.now(),
files: uploadedFiles
});

status.innerText = 'Upload successful';

const box = document.getElementById('generatedCode');
box.classList.remove('hidden');

document.getElementById('transferCodeDisplay').innerText = code;

}catch(err){

console.error(err);
status.innerText = 'Upload failed';

}

}

async function fetchFiles(){

const code = document.getElementById('receiveCode').value.trim();

if(!code){
alert('Enter transfer code');
return;
}

const status = document.getElementById('receiveStatus');
status.innerText = 'Fetching files...';

try{

const doc = await db.collection('transfers').doc(code).get();

if(!doc.exists){
status.innerText = 'Invalid transfer code';
return;
}

const data = doc.data();

const area = document.getElementById('downloadArea');
area.innerHTML = '';

for(const file of data.files){

const div = document.createElement('div');

const sizeMB = (file.size / (1024*1024)).toFixed(2);

div.className = 'bg-green-50 border border-green-200 rounded-2xl p-4';

div.innerHTML = `

<div class="font-bold text-green-900 text-lg">
${file.name}
</div>

<div class="text-sm text-gray-600 mt-1">
${sizeMB} MB
</div>

<a
href="${file.url}"
download
class="inline-block mt-4 bg-green-700 hover:bg-green-800 text-white px-5 py-3 rounded-xl font-bold"
>
Download
</a>

`;

area.appendChild(div);

}

status.innerText = 'Files fetched successfully';

}catch(err){

console.error(err);
status.innerText = 'Unable to fetch files';

}

}

</script>

</body>
</html>
